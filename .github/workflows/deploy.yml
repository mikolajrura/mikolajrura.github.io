name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Assemble site (landing at root, Quartz under /pharmacology)
        run: |
          mkdir -p site/pharmacology
          cp -r public/. site/pharmacology/
          cp landing/index.html site/index.html
          cp landing/404.html   site/404.html
          mkdir -p site/cv && cp landing/cv.html site/cv/index.html
          mkdir -p site/ataxia && cp landing/ataxia.html site/ataxia/index.html
          mkdir -p site/tumor-manifest && cp landing/tumor-manifest.html site/tumor-manifest/index.html
          cp landing/bg.mp4 site/
          echo "--- site root ---"; ls -1 site
          test -f site/pharmacology/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
